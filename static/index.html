<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Script Extractor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
// applied before first paint so the theme never flashes
document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:radial-gradient(circle at top,#1a1d35 0%,#0b0b0d 45%,#070708 100%);
--text:#fff;
--muted:#a3a3ad;
--container-bg:rgba(18,18,22,.75);
--container-border:rgba(255,255,255,.08);
--input-bg:#111116;
--input-border:#2a2a33;
--result-bg:#0d0d10;
--result-border:#26262c;
--result-header-bg:#121217;
--btn-bg:#18181d;
--btn-border:#2c2c34;
--btn-hover-bg:#23232b;
--footer-color:#7c7c86;
--accent:#6366f1;
--accent2:#8b5cf6;
--line-number-color:#55555f;
--toast-shadow:0 10px 30px rgba(0,0,0,.35);
}

:root[data-theme="light"]{
--bg:radial-gradient(circle at top,#eef0ff 0%,#f7f7fb 45%,#ffffff 100%);
--text:#16161a;
--muted:#5b5b66;
--container-bg:rgba(255,255,255,.75);
--container-border:rgba(0,0,0,.08);
--input-bg:#ffffff;
--input-border:#d8d8e0;
--result-bg:#ffffff;
--result-border:#e2e2ea;
--result-header-bg:#f4f4f8;
--btn-bg:#ffffff;
--btn-border:#d8d8e0;
--btn-hover-bg:#f0f0f5;
--footer-color:#77778a;
--accent:#6366f1;
--accent2:#8b5cf6;
--line-number-color:#b5b5c2;
--toast-shadow:0 10px 30px rgba(0,0,0,.12);
}

body{

font-family:Inter,sans-serif;
background:var(--bg);
color:var(--text);

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;
padding:40px;
transition:background .3s ease,color .3s ease;
}

.container{

width:900px;
max-width:100%;

/* the card is bounded by the viewport, so revealing the thumbnail shrinks
   the result box instead of pushing it below the fold */
max-height:calc(100vh - 80px);
display:flex;
flex-direction:column;

background:var(--container-bg);

backdrop-filter:blur(20px);

border:1px solid var(--container-border);

border-radius:22px;

padding:36px;

box-shadow:

0 20px 80px rgba(0,0,0,.45),

0 0 0 1px rgba(255,255,255,.02) inset;

animation:fadeInUp .5s ease;

}

@keyframes fadeInUp{
from{ opacity:0; transform:translateY(14px); }
to{ opacity:1; transform:translateY(0); }
}

.header{

margin-bottom:28px;

flex:0 0 auto;

}

.header-top{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:18px;

}

.brand{

display:flex;

align-items:center;

gap:10px;

}

.icon-btn{

width:38px;

height:38px;

border-radius:50%;

border:1px solid var(--btn-border);

background:var(--btn-bg);

color:var(--text);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

transition:.2s;

}

.icon-btn:hover{

background:var(--btn-hover-bg);

border-color:var(--accent);

}

.icon-btn:active{

transform:scale(.92);

}

h1{

font-size:34px;

font-weight:700;

letter-spacing:-1px;

margin-bottom:10px;

}

.desc{

color:var(--muted);

line-height:1.6;

}

.controls{

display:flex;

gap:12px;

margin-top:28px;

flex:0 0 auto;

}

.input-wrap{

position:relative;

flex:1;

min-width:0;

display:flex;

}

input{

flex:1;

height:56px;

background:var(--input-bg);

border:1px solid var(--input-border);

border-radius:14px;

padding:0 46px 0 18px;

color:var(--text);

font-size:15px;

transition:.25s;

min-width:0;

}

.clear-btn{

position:absolute;

top:50%;

right:12px;

transform:translateY(-50%);

width:26px;

height:26px;

border-radius:50%;

border:none;

background:transparent;

color:var(--muted);

display:none;

align-items:center;

justify-content:center;

cursor:pointer;

transition:.2s;

padding:0;

}

.clear-btn.visible{ display:flex; }

.clear-btn:hover{

background:var(--btn-hover-bg);

color:var(--text);

}

.clear-btn:active{ transform:translateY(-50%) scale(.9); }

input:focus{

outline:none;

border-color:var(--accent);

box-shadow:0 0 0 4px rgba(99,102,241,.18);

}

select{

width:170px;

background:var(--input-bg);

border:1px solid var(--input-border);

border-radius:14px;

color:var(--text);

padding:0 16px;

font-size:15px;

transition:.25s;

}

select:focus{

outline:none;

border-color:var(--accent);

box-shadow:0 0 0 4px rgba(99,102,241,.18);

}

.extract{

height:56px;

padding:0 28px;

border:none;

cursor:pointer;

border-radius:14px;

font-weight:600;

font-size:15px;

color:white;

display:flex;

align-items:center;

justify-content:center;

gap:8px;

background:

linear-gradient(135deg,#6366f1,#8b5cf6);

transition:.25s;

}

.extract:hover:not(:disabled){

transform:translateY(-2px);

box-shadow:0 12px 30px rgba(99,102,241,.45);

}

.extract:active:not(:disabled){

transform:translateY(0) scale(.98);

}

.extract:disabled{

opacity:.6;

cursor:not-allowed;

}

.thumbnail-wrap{

margin-top:16px;

border-radius:14px;

overflow:hidden;

border:1px solid var(--input-border);

display:none;

flex:0 0 auto;

}

.thumbnail-wrap img{

display:block;

width:100%;

max-height:140px;

object-fit:cover;

animation:fadeIn .3s ease;

}

@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

.progress{

margin-top:16px;

flex:0 0 auto;

height:4px;

border-radius:999px;

background:var(--input-bg);

overflow:hidden;

display:none;

}

.progress-bar{

width:35%;

height:100%;

border-radius:999px;

background:linear-gradient(90deg,var(--accent),var(--accent2));

animation:indeterminate 1.1s ease-in-out infinite;

}

@keyframes indeterminate{

0%{ transform:translateX(-100%); }

100%{ transform:translateX(285%); }

}

.status-line{

margin-top:16px;

font-size:13px;

color:var(--muted);

min-height:18px;

flex:0 0 auto;

}

.result{

margin-top:16px;

border-radius:18px;

overflow:hidden;

border:1px solid var(--result-border);

background:var(--result-bg);

transition:background .3s ease,border-color .3s ease;

/* takes the leftover card height; min-height:0 lets it shrink below its
   content so the scrollbar stays inside the box */
flex:1 1 auto;

min-height:0;

display:flex;

flex-direction:column;

}

.result-header{

flex:0 0 auto;

display:flex;

justify-content:space-between;

align-items:center;

padding:16px 20px;

border-bottom:1px solid var(--result-border);

background:var(--result-header-bg);

flex-wrap:wrap;

gap:10px;

}

.result-title{

font-weight:600;

}

.result-body{

display:flex;

/* was a fixed 420px; now fills whatever the card has left. The floor keeps
   it usable, and min-height:0 keeps the children from forcing it taller. */
flex:1 1 auto;

min-height:200px;

}

.line-numbers{

flex:0 0 auto;

width:44px;

/* no height:100% - the parent's height now comes from flex sizing, which
   percentage heights can't resolve against. align-items:stretch does it. */
min-height:0;

padding:24px 8px 24px 0;

text-align:right;

color:var(--line-number-color);

font-family:Consolas,monospace;

font-size:14px;

line-height:1.8;

white-space:pre;

overflow:hidden;

user-select:none;

border-right:1px solid var(--result-border);

}

textarea{

flex:1;

min-width:0;

min-height:0;

background:transparent;

border:none;

padding:24px;

resize:none;

color:var(--text);

font-size:14px;

line-height:1.8;

font-family:Consolas,monospace;

white-space:pre;

overflow:auto;

}

textarea:focus{

outline:none;

}

.actions{

display:flex;

gap:12px;

}

.btn{

height:40px;

padding:0 16px;

border-radius:12px;

border:1px solid var(--btn-border);

background:var(--btn-bg);

color:var(--text);

cursor:pointer;

transition:.2s;

display:flex;

align-items:center;

gap:6px;

font-size:14px;

}

.btn:hover:not(:disabled){

background:var(--btn-hover-bg);

border-color:var(--accent);

}

.btn:active:not(:disabled){

transform:scale(.96);

}

.btn:disabled{

opacity:.45;

cursor:not-allowed;

}

.footer{

margin-top:18px;

font-size:13px;

color:var(--footer-color);

flex:0 0 auto;

}

.toast-container{

position:fixed;

bottom:24px;

right:24px;

display:flex;

flex-direction:column;

gap:10px;

z-index:1000;

}

.toast{

display:flex;

align-items:center;

gap:8px;

background:var(--result-header-bg);

border:1px solid var(--result-border);

color:var(--text);

padding:12px 18px;

border-radius:12px;

font-size:14px;

box-shadow:var(--toast-shadow);

opacity:0;

transform:translateY(10px);

transition:opacity .3s ease,transform .3s ease;

}

.toast.show{

opacity:1;

transform:translateY(0);

}

.toast-dot{

width:8px;

height:8px;

border-radius:50%;

background:var(--accent);

flex:0 0 auto;

}

@media (max-width: 640px){

body{ padding:16px; }

/* a viewport-bounded card is too cramped on phones, so let the page scroll */
.container{ padding:24px; max-height:none; }

h1{ font-size:26px; }

.controls{ flex-direction:column; }

.input-wrap, select, .extract{ width:100%; }

.result-body{ flex:0 0 auto; height:320px; }

.result-header{ align-items:flex-start; }

.toast-container{ left:16px; right:16px; bottom:16px; }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="header-top">

<div class="brand">

<svg width="44" height="31" viewBox="0 0 640 448" fill="none" aria-label="YouTube">
<path d="M320 0c112 0 196 4 244 12 38 6 62 30 68 68 6 40 8 89 8 144s-2 104-8 144c-6 38-30 62-68 68-48 8-132 12-244 12s-196-4-244-12c-38-6-62-30-68-68C2 328 0 279 0 224S2 120 8 80c6-38 30-62 68-68C124 4 208 0 320 0Z" fill="#FF0000"/>
<path d="M258 128l160 96-160 96V128Z" fill="#fff"/>
</svg>

</div>

<button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
<svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="4"/>
<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
</svg>
<svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
</svg>
</button>

</div>

<h1>
YouTube Script Extractor
</h1>

<div class="desc">
Paste a YouTube URL to instantly extract captions and export them as plain text or SRT subtitles.
</div>

</div>

<div class="controls">

<div class="input-wrap">

<input
type="text"
id="url"
placeholder="https://youtube.com/watch?v=..."
>

<button class="clear-btn" id="clearBtn" onclick="clearAll()" title="Clear" aria-label="Clear input">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

</div>

<select id="format">

<option value="srt" selected>SRT</option>

<option value="plain">Plain Text</option>

<option value="timestamped">Timestamp</option>

</select>

<button class="extract" id="extractBtn" onclick="extract()">
⚡ Extract Script
</button>

</div>

<div class="thumbnail-wrap" id="thumbnailWrap">
<img id="thumbnail" alt="Video thumbnail">
</div>

<div class="progress" id="progress"><div class="progress-bar"></div></div>

<div id="status" class="status-line"></div>

<div class="result">

<div class="result-header">

<div class="result-title">

Extracted Script

</div>

<div class="actions">

<button class="btn" id="copyBtn" onclick="copyText()" disabled>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
Copy
</button>

<button class="btn" id="downloadBtn" onclick="downloadText()" disabled>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
Download
</button>

</div>

</div>

<div class="result-body">
<div id="lineNumbers" class="line-numbers">1</div>
<textarea id="result" readonly wrap="off" placeholder="The extracted subtitles will appear here..."></textarea>
</div>

</div>

<div id="meta" class="footer"></div>

<div class="footer">

Supports videos with public captions only.

</div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let lastTitle = "script";
let lastFormat = "srt";
let thumbTimer;

function extractVideoId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function updateThumbnail() {
  const url = document.getElementById("url").value.trim();
  const wrap = document.getElementById("thumbnailWrap");
  const img = document.getElementById("thumbnail");
  const id = extractVideoId(url);
  if (!id) {
    wrap.style.display = "none";
    return;
  }
  img.onerror = () => { wrap.style.display = "none"; };
  img.onload = () => { wrap.style.display = "block"; };
  img.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function setActionsEnabled(enabled) {
  document.getElementById("copyBtn").disabled = !enabled;
  document.getElementById("downloadBtn").disabled = !enabled;
}

function clearResults() {
  const result = document.getElementById("result");
  result.value = "";
  updateLineNumbers();
  document.getElementById("meta").textContent = "";
  document.getElementById("status").textContent = "";
  setActionsEnabled(false);
}

function clearAll() {
  const input = document.getElementById("url");
  input.value = "";
  document.getElementById("clearBtn").classList.remove("visible");
  document.getElementById("thumbnailWrap").style.display = "none";
  clearResults();
  input.focus();
}

document.getElementById("url").addEventListener("input", () => {
  const input = document.getElementById("url");
  document.getElementById("clearBtn").classList.toggle("visible", input.value.length > 0);
  clearResults();
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(updateThumbnail, 400);
});

function updateLineNumbers() {
  const ta = document.getElementById("result");
  const ln = document.getElementById("lineNumbers");
  const lines = ta.value === "" ? 1 : ta.value.split("\n").length;
  let out = "";
  for (let i = 1; i <= lines; i++) out += i + (i < lines ? "\n" : "");
  ln.textContent = out;
}

document.getElementById("result").addEventListener("scroll", () => {
  document.getElementById("lineNumbers").scrollTop = document.getElementById("result").scrollTop;
});

function showToast(message) {
  const container = document.getElementById("toastContainer");
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = '<span class="toast-dot"></span><span></span>';
  toast.querySelector("span:last-child").textContent = message;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

async function extract() {
  const url = document.getElementById("url").value.trim();
  const format = document.getElementById("format").value;
  const status = document.getElementById("status");
  const meta = document.getElementById("meta");
  const result = document.getElementById("result");
  const btn = document.getElementById("extractBtn");
  const progress = document.getElementById("progress");

  if (!url) {
    status.textContent = "Please enter a URL.";
    return;
  }

  btn.disabled = true;
  meta.textContent = "";
  result.value = "";
  updateLineNumbers();
  setActionsEnabled(false);
  progress.style.display = "block";
  status.textContent = "Fetching captions...";

  try {
    const res = await fetch("/api/extract", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, format }),
    });
    const data = await res.json();

    if (!data.ok) {
      status.textContent = "Error: " + data.error;
      return;
    }

    lastTitle = data.title || "script";
    lastFormat = format;
    result.value = data.text || "";
    updateLineNumbers();
    setActionsEnabled(result.value.trim().length > 0);

    const genLabel = data.is_generated ? " · auto-generated" : "";
    meta.textContent = `Title: ${data.title || "-"} | Captions${genLabel} | Language: ${data.language || "-"}`;
    status.textContent = "Done";
    showToast("Script extracted successfully");
  } catch (e) {
    status.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
    progress.style.display = "none";
  }
}

function copyText() {
  const result = document.getElementById("result");
  result.select();
  document.execCommand("copy");
}

function downloadText() {
  const text = document.getElementById("result").value;
  if (!text) return;
  const ext = lastFormat === "srt" ? "srt" : "txt";
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const safeTitle = lastTitle.replace(/[\\/:*?"<>|]/g, "_").slice(0, 80);
  a.download = `${safeTitle}.${ext}`;
  a.click();
}

document.getElementById("url").addEventListener("keydown", (e) => {
  if (e.key === "Enter") extract();
});

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("iconSun").style.display = theme === "dark" ? "block" : "none";
  document.getElementById("iconMoon").style.display = theme === "light" ? "block" : "none";
  localStorage.setItem("theme", theme);
}

document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  applyTheme(current === "dark" ? "light" : "dark");
});

applyTheme(localStorage.getItem("theme") || "light");
updateLineNumbers();
setActionsEnabled(false);
</script>

</body>
</html>
